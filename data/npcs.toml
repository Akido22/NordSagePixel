# Жители. Расставляются в разделе [npcs] файлов локаций (game/levels/*.txt) по id.
#
#   name   — имя над репликой
#   lines  — реплики по порядку; {hero} заменяется именем героя
#   facing — куда смотрит, когда героя нет рядом: 1 вправо, -1 влево
#   shop   — id лавки из shops.toml (если житель торгует)
#   held   — что в руке: { icon = "sword" | "spear" | "axe" | "knife" | "hammer", tint = {...} }
#   look   — облик из слоёв спрайтов (assets/sprites):
#            torso  — hero_torso_plain | hero_torso_shirt | hero_torso_leather | hero_torso_mail | hero_torso_dress
#            head   — hero_head_male | hero_head_female
#            helmet — hero_helmet_cap | hero_helmet_shishak | hero_helmet_crown (необязательно)
#            *_tint — перекраска слоя: { "старый цвет" = "новый" }, цвета 0-9, a-f
#            (волосы и борода — цвет "a", кожа — "e", глаза — "c", рубаха — "7"/"8")

hero_name = "Ратмир"

[elder]
name = "Старейшина Всеслав"
lines = [
    "А, {hero}! Добро пожаловать на площадь Велеграда.",
    "Это Стела Предков. Поклонись ей - и предки запомнят твой путь.",
    "За восточными воротами завелись волки, а у старых камней бродят драугры.",
    "Ступай туда, витязь. Кузнец и купец помогут собраться в дорогу.",
]
look = { torso = "hero_torso_dress", torso_tint = { "8" = "c", "a" = "a" }, head_tint = { "a" = "6" } }

[smith]
name = "Кузнец Добрыня"
lines = [
    "Мой молот не знает отдыха ни днём, ни ночью.",
    "Нож - не оружие для витязя. Говорят, в лесу есть сундук с добрым мечом.",
    "Принеси железные крицы - драугры таскают их с собой. Перекую твой клинок, станет злее.",
]
look = { torso = "hero_torso_leather", head_tint = { "a" = "2" } }
held = { icon = "hammer", tint = { "a" = "5", "6" = "6" } }
facing = -1
shop = "smith"

[merchant]
name = "Купец Торвальд"
lines = [
    "Хейль, друг! Я Торвальд, приплыл из Бирки по рекам.",
    "Мёд, хлеб, щиты, обереги - всё за честное серебро. Куплю и твоё добро.",
    "Погибнешь - серебро останется там, где упал. Вернись за ним, пока не поздно.",
]
look = { torso = "hero_torso_shirt", torso_tint = { "7" = "c", "8" = "a" }, head_tint = { "a" = "9" }, helmet = "hero_helmet_cap", legs_tint = { "5" = "c" } }
shop = "merchant"

[herbalist]
name = "Травница Млада"
lines = [
    "Травы в лесу нынче шепчут тревожно...",
    "Настой зверобоя вернёт силу чар. А руна Беркана заживит раны - только твори её не под ударом.",
    "Береги себя, {hero}.",
]
look = { torso = "hero_torso_dress", torso_tint = { "8" = "b", "a" = "7" }, head = "hero_head_female" }
facing = -1
shop = "herbalist"

[guard]
name = "Стражник Ярополк"
lines = [
    "За воротами - Лесная тропа. Дальше начинается глушь.",
    "Подойди к воротам и нажми вверх, чтобы выйти из города.",
    "Держи щит повыше, витязь.",
]
look = { torso = "hero_torso_mail", head_tint = { "a" = "4" }, helmet = "hero_helmet_shishak" }
held = { icon = "spear" }
facing = -1

[trainer]
name = "Воевода Свенельд"
lines = [
    "Хочешь выжить за воротами - учись здесь, на чучелах.",
    "X - удар. Жми чаще - выйдет серия из трёх. Держи X - сильный удар, он ломает щиты.",
    "C - щит. Блок тратит силы - следи за зелёной полосой под жизнью.",
    "Подними щит прямо перед вражьим ударом - это парирование. Оглушённого бей - удар будет страшен.",
    "V - перекат. Пока катишься, вражий клинок тебя не тронет.",
    "В прыжке жми вниз и удар - обрушишься на врага сверху.",
    "F - чары выученной руны, E - сменить руну. Синяя полоса - твоя мана.",
]
look = { torso = "hero_torso_shirt", torso_tint = { "7" = "8", "8" = "a" }, head_tint = { "a" = "5" }, helmet = "hero_helmet_shishak" }
held = { icon = "sword" }
