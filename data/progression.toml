# Прокачка героя, заточка оружия, торговля и стартовое снаряжение.

[base]
hp = 10             # жизнь без снаряжения и очков
attack = 1
defense = 0
stamina = 100       # выносливость
mana = 30

[levels]
max_level = 20
# Опыта до следующего уровня: xp_base + xp_step * (уровень - 1) -> 20, 35, 50, 65...
xp_base = 20
xp_step = 15
points_per_level = 1

# Сколько даёт одно очко, вложенное у Стелы или рунного камня.
[stats]
strength = 1        # Сила: атака +1
endurance = 12      # Стойкость: выносливость +12
vitality = 2        # Здоровье: жизнь +2
spirit = 8          # Дух: мана +8 (и сила чар +1)

[forge]
max_upgrade = 3
# Цена заточки по ступеням: [серебро, крицы]. Каждая ступень — атака +1.
cost = [[15, 1], [30, 2], [50, 3]]

[trade]
sell_rate = 0.4     # за какую долю цены лавки покупают вещи героя

[start]
weapon = "knife"
armor = "shirt"
items = [["bread", 2]]   # [id, сколько]
