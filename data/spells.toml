# Чары рун. id раздела = id руны из items.toml.
#   name   — название
#   cost   — расход маны
#   cast   — сколько кадров творятся (герой в это время уязвим), 60 кадров = 1 с
#   color  — цвет свечения руки (номер цвета палитры 0-15)
#   ground_only — творить только стоя на земле
# Сила огня и лечения растёт на 1 за каждое очко Духа.

[rune_fire]
name = "Огонь Кеназ"
cost = 10
cast = 14
color = 9
damage = 4          # урон огненного шара (+ Дух)
speed = 3.2         # скорость полёта, пикселей за кадр

[rune_shield]
name = "Щит Альгиз"
cost = 25
cast = 10
color = 10
duration = 150      # сколько кадров щит Перуна гасит удары

[rune_heal]
name = "Беркана"
cost = 25
cast = 36
color = 11
ground_only = true
heal = 6            # сколько жизни возвращает (+ Дух)
