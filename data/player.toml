# Бой и движение героя. Время — в кадрах (60 кадров = 1 секунда),
# скорость — пикселей за кадр.

[movement]
max_speed = 1.35
jump_velocity = 4.1     # сила прыжка (~36 пикселей вверх)
coyote_frames = 6       # можно прыгнуть чуть после схода с края
jump_buffer = 7         # нажатие прыжка чуть до приземления засчитывается

[stamina]
regen = 1.1             # в кадр
delay = 35              # пауза перед восстановлением после траты
exhaust_delay = 70      # пауза, если силы кончились совсем
roll_cost = 28
heavy_cost = 32
plunge_cost = 14
# расход на обычный удар задаёт оружие (поле stamina в items.toml)

[combat]
parry_window = 10       # кадров после поднятия щита, когда удар парируется
block_cooldown = 14     # нельзя сразу снова поднять щит после опускания
charge_frames = 20      # сколько держать удар после взмаха для тяжёлого удара
combo_max = 3           # ударов в серии
invuln_frames = 70      # неуязвимость после ранения
roll_frames = 22        # длительность переката
roll_iframes = [2, 16]  # кадры переката, когда герой неуязвим
input_buffer = 8        # сколько кадров помнится нажатие

[magic]
mana_regen = 0.03       # в кадр (~1,8 в секунду)
