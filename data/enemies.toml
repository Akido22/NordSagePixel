# Враги. Время — в кадрах (60 кадров = 1 секунда), скорость — пикселей за кадр,
# расстояния — в пикселях (тайл = 8 пикселей). Урон по герою снижается его защитой:
# урон * 6 / (6 + защита), но не меньше 1.
#
# Общие поля:
#   hp              — жизнь
#   contact_damage  — урон, если герой просто столкнулся с врагом
#   knockback       — насколько далеко врага отбрасывает удар героя
#   xp              — опыт за победу
#   silver          — серебро за победу: [от, до]
#   ore_chance      — шанс выронить железную крицу (0.35 = 35%)
#   bread_chance    — шанс выронить каравай
#   stun_frames     — сколько враг оглушён после парирования (удар по нему — критический)

[wolf]
hp = 4
contact_damage = 1
lunge_damage = 3        # урон прыжка-выпада
knockback = 2.4
xp = 5
silver = [1, 3]
stun_frames = 80
crouch_frames = 20      # присед перед выпадом — подсказка игроку
lunge_cooldown = 90     # пауза между выпадами
lunge_range = 44        # с какого расстояния бросается
chase_speed = 1.25
patrol_speed = 0.5
sight = 110             # с какого расстояния замечает героя

[draugr]
hp = 8
contact_damage = 1
strike_damage = 4       # удар мечом
knockback = 1.3
xp = 10
silver = [3, 5]
ore_chance = 0.35
bread_chance = 0.5
stun_frames = 90
reach = 18              # дальность удара мечом
windup_frames = 34      # замах (глаза вспыхивают) — время поднять щит или откатиться
recover_frames = 40     # передышка после удара — время бить в ответ
chase_speed = 0.55
patrol_speed = 0.3
sight = 120

# Драугр со щитом: всё как у [draugr], кроме указанного здесь.
[shield_draugr]
hp = 10
xp = 14
silver = [4, 6]
guard = 3               # сколько лёгких ударов спереди выдерживает щит
guard_regen_frames = 120  # за сколько кадров восстанавливается одна «прочность» щита

[archer]
hp = 4
contact_damage = 1
knockback = 2.2
xp = 8
silver = [2, 4]
ore_chance = 0.25
stun_frames = 90
aim_frames = 44         # натягивает тетиву — блеск наконечника перед выстрелом
shot_cooldown = 50      # пауза между выстрелами
arrow_damage = 2
arrow_speed = 2.8
reflected_damage = 3    # урон отражённой стрелы по врагам
keep_away = 48          # ближе этого пятится от героя
sight = 150
