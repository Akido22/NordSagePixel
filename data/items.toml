# Предметы «Северной Саги».
#
# Каждый раздел [id] — один предмет. id используется в сундуках (game/levels/*.txt),
# лавках (shops.toml) и сохранениях — не переименовывайте id у существующих вещей.
#
# Поля:
#   name     — название в игре
#   kind     — вид: weapon (оружие), shield (щит), helmet (шлем), armor (доспех),
#              amulet (оберег), consumable (припасы), material (для кузни), rune (руна чар)
#   icon     — иконка из game/gfx.py; для оружия — ещё и спрайт в руке (knife, sword, axe, spear)
#   desc     — описание
#   price    — цена в лавке (продать можно за долю sell_rate из progression.toml)
#   atk      — прибавка к атаке           defense — к защите
#   hp       — прибавка к жизни           heal    — сколько жизни лечит (припасы)
#   mana     — сколько маны возвращает (припасы)
#   reach    — дальность удара в пикселях (оружие)
#   swing    — длительность взмаха в кадрах, 60 кадров = 1 секунда (оружие)
#   stamina  — расход выносливости на удар (оружие)
#   tint     — перекраска иконки: { "старый цвет" = "новый" }, цвета 0-9, a-f
#   shield_colors — цвета щита на герое: [обод, поле, умбон]

