# Боссы. Время — в кадрах (60 кадров = 1 секунда), расстояния — в пикселях.
# Во второй фазе (ярости) все замахи и передышки короче в rage_speed раз.

[jarl]
name = "ЯРЛ-ДРАУГР ХРЁРЕК"
subtitle = "Владыка кургана"
hp = 70
contact_damage = 2
xp = 100
silver = 12             # монет при гибели
rage_at = 0.5           # доля жизни, на которой ярл впадает в ярость (вторая фаза)
rage_speed = 1.3
walk_speed = 0.55

# Серия из трёх ударов секирой (можно парировать).
chain_damage = 4
chain_reach = 32
chain_windup = 24       # первый замах
chain_next = 15         # замах второго и третьего удара
chain_recover = 50      # передышка после серии
stun_frames = 70        # оглушение после парирования (первая фаза)
rage_stun_frames = 50   # ... во второй фазе

# Прыжок с ударом оземь и ударные волны (не парируются).
slam_damage = 5         # если приземлился прямо на героя
shockwave_damage = 3
shockwave_speed = 2.3
rage_shockwave_speed = 2.8
leap_windup = 34        # присед с золотой вспышкой
slam_recover = 46
leap_distance = 70      # прыгает, если герой дальше

# Круговой удар во второй фазе (красная вспышка, щитом не отразить).
sweep_damage = 5
sweep_reach = 38
sweep_windup = 40
sweep_recover = 45
sweep_chance = 0.4      # как часто выбирает круговой удар вблизи
